services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Docker tarmog'i: mahalliy .env dagi localhost emas, db servisi
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      USE_SQLITE: "0"
      REDIS_URL: redis://redis:6379/0
      SEED_DEMO: ${SEED_DEMO:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - media_data:/var/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media_data:
