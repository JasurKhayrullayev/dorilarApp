# Render.com — bepul Web Service (API).
# Neon.tech yoki boshqa joydan DATABASE_URL oling va Render Dashboard-da Environment qo'shing.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bad-crm-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && echo "from crm.models import User; u = User.objects.get(username='admin'); u.set_password('demo123'); u.save(); print('Parol yangilandi OK')" | python manage.py shell && gunicorn bad_crm.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_DEBUG
        value: "0"
      - key: USE_SQLITE
        value: "0"
      # Render Dashboard: dorilarapp.onrender.com (https:// va vergul — faqat hostname)
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
